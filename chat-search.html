<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Search - Last 2 Days</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .search-section {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-button {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .filter-button.active {
            background: #667eea;
            color: white;
        }
        
        .filter-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        .chat-messages {
            padding: 30px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .message {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .message-user {
            font-weight: bold;
            color: #667eea;
        }
        
        .message-time {
            font-size: 0.85rem;
            color: #888;
        }
        
        .message-content {
            color: #333;
            line-height: 1.5;
        }
        
        .no-messages {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .stats {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #666;
        }
        
        .add-message-section {
            padding: 30px;
            background: #f8f9fa;
            border-top: 2px solid #e0e0e0;
        }
        
        .add-message-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .add-message-form {
            display: flex;
            gap: 10px;
        }
        
        .add-message-form input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        
        .add-message-form button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.3s;
        }
        
        .add-message-form button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat Search</h1>
            <p>Search and filter messages from the last 2 days</p>
        </div>
        
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search messages...">
            </div>
            <div class="filters">
                <button class="filter-button active" data-filter="all">All Messages</button>
                <button class="filter-button" data-filter="today">Today</button>
                <button class="filter-button" data-filter="yesterday">Yesterday</button>
                <button class="filter-button" data-filter="last2days">Last 2 Days</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be dynamically inserted here -->
        </div>
        
        <div class="stats">
            <span id="messageCount">0 messages</span>
            <span id="dateRange"></span>
        </div>
        
        <div class="add-message-section">
            <h3>Add Test Message</h3>
            <div class="add-message-form">
                <input type="text" id="newMessageInput" placeholder="Type a message...">
                <button onclick="addMessage()">Send</button>
            </div>
        </div>
    </div>
    
    <script>
        // Sample chat data
        let chatData = [
            {
                user: "Alice",
                message: "Hey everyone! How's the project going?",
                timestamp: new Date(Date.now() - 2 * 60 * 60 * 1000) // 2 hours ago
            },
            {
                user: "Bob",
                message: "Great! Just finished the authentication module.",
                timestamp: new Date(Date.now() - 3 * 60 * 60 * 1000) // 3 hours ago
            },
            {
                user: "Charlie",
                message: "Anyone available for a quick code review?",
                timestamp: new Date(Date.now() - 24 * 60 * 60 * 1000) // 1 day ago
            },
            {
                user: "Diana",
                message: "I'll be available in 30 minutes!",
                timestamp: new Date(Date.now() - 25 * 60 * 60 * 1000) // ~1 day ago
            },
            {
                user: "Eve",
                message: "The new feature looks amazing!",
                timestamp: new Date(Date.now() - 40 * 60 * 60 * 1000) // ~1.7 days ago
            },
            {
                user: "Frank",
                message: "Can we schedule a meeting for tomorrow?",
                timestamp: new Date(Date.now() - 45 * 60 * 60 * 1000) // ~1.9 days ago
            },
            {
                user: "Grace",
                message: "Sure, what time works for you?",
                timestamp: new Date(Date.now() - 46 * 60 * 60 * 1000) // ~1.9 days ago
            }
        ];
        
        let currentFilter = 'all';
        let searchQuery = '';
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderMessages();
            setupEventListeners();
            updateStats();
        });
        
        function setupEventListeners() {
            // Search input
            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchQuery = e.target.value.toLowerCase();
                renderMessages();
            });
            
            // Filter buttons
            document.querySelectorAll('.filter-button').forEach(button => {
                button.addEventListener('click', function() {
                    document.querySelectorAll('.filter-button').forEach(btn => 
                        btn.classList.remove('active')
                    );
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderMessages();
                });
            });
        }
        
        function filterMessages() {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const twoDaysAgo = new Date(today);
            twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
            
            return chatData.filter(msg => {
                // Filter by date
                let dateMatch = true;
                if (currentFilter === 'today') {
                    dateMatch = msg.timestamp >= today;
                } else if (currentFilter === 'yesterday') {
                    dateMatch = msg.timestamp >= yesterday && msg.timestamp < today;
                } else if (currentFilter === 'last2days') {
                    dateMatch = msg.timestamp >= twoDaysAgo;
                }
                
                // Filter by search query
                let searchMatch = true;
                if (searchQuery) {
                    searchMatch = msg.message.toLowerCase().includes(searchQuery) ||
                                msg.user.toLowerCase().includes(searchQuery);
                }
                
                return dateMatch && searchMatch;
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function renderMessages() {
            const messagesContainer = document.getElementById('chatMessages');
            const filteredMessages = filterMessages();
            
            if (filteredMessages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="no-messages">
                        <p>No messages found</p>
                    </div>
                `;
                return;
            }
            
            messagesContainer.innerHTML = filteredMessages
                .sort((a, b) => b.timestamp - a.timestamp)
                .map(msg => `
                    <div class="message">
                        <div class="message-header">
                            <span class="message-user">${escapeHtml(msg.user)}</span>
                            <span class="message-time">${formatTime(msg.timestamp)}</span>
                        </div>
                        <div class="message-content">${escapeHtml(msg.message)}</div>
                    </div>
                `).join('');
            
            updateStats();
        }
        
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(hours / 24);
            
            if (hours < 1) {
                const minutes = Math.floor(diff / (1000 * 60));
                return `${minutes} minute${minutes !== 1 ? 's' : ''} ago`;
            } else if (hours < 24) {
                return `${hours} hour${hours !== 1 ? 's' : ''} ago`;
            } else {
                return `${days} day${days !== 1 ? 's' : ''} ago`;
            }
        }
        
        function updateStats() {
            const filteredMessages = filterMessages();
            const count = filteredMessages.length;
            document.getElementById('messageCount').textContent = 
                `${count} message${count !== 1 ? 's' : ''}`;
            
            if (filteredMessages.length > 0) {
                const oldest = new Date(Math.min(...filteredMessages.map(m => m.timestamp)));
                const newest = new Date(Math.max(...filteredMessages.map(m => m.timestamp)));
                document.getElementById('dateRange').textContent = 
                    `${formatTime(oldest)} - ${formatTime(newest)}`;
            } else {
                document.getElementById('dateRange').textContent = '';
            }
        }
        
        function addMessage() {
            const input = document.getElementById('newMessageInput');
            const message = input.value.trim();
            
            if (message) {
                chatData.push({
                    user: "You",
                    message: message,
                    timestamp: new Date()
                });
                
                input.value = '';
                renderMessages();
            }
        }
        
        // Allow Enter key to send message
        const newMessageInput = document.getElementById('newMessageInput');
        if (newMessageInput) {
            newMessageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addMessage();
                }
            });
        }
    </script>
</body>
</html>
